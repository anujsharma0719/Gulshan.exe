<!DOCTYPE html>
<html>
<head>
    <title>For Gulshan ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>

        body {
            background-color: black;
            color: #00ff41;
            font-family: monospace;
            margin: 0;
            min-height: 100vh;
            padding: 30px;
        }

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border: 1px solid #00ff41;
    padding: 12px 14px;
    margin-bottom: 25px;
    font-size: 16px;
    text-shadow: 0 0 8px #00ff41;
    box-shadow: 0 0 8px rgba(0, 255, 65, 0.25);
}

        .terminal {
            font-size: 18px;
            text-shadow: 0 0 8px #00ff41;
            line-height: 1.6;
        }

        @media (max-width: 600px) {

    body {
        padding: 18px;
    }

    .header {
        font-size: 14px;
        padding: 12px;
    }

    .terminal {
    font-size: 17px;
    line-height: 1.7;
}

}

    </style>

</head>

<body>
<div class="header">
    <span>[ GULSHAN.EXE ]</span>
    <span>ANUJ SYSTEMS</span>
</div>

<div class="terminal" id="terminal"></div>

    <script src="script.js"></script>

</body>
</html>
