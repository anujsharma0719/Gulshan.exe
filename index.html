<!DOCTYPE html>
<html>

<head>

    <title>For Gulshan ❤️</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        body {
            background-color: black;
            color: #00ff41;
            font-family: monospace;
            margin: 0;
            min-height: 100vh;
            padding: 30px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #00ff41;
            padding: 12px 14px;
            margin-bottom: 25px;
            font-size: 16px;
            text-shadow: 0 0 8px #00ff41;
            box-shadow: 0 0 8px rgba(0, 255, 65, 0.25);
        }

        .terminal {
            font-size: 18px;
            text-shadow: 0 0 8px #00ff41;
            line-height: 1.6;
        }

        /* SECURE CONNECTION */

        .connection-panel {
            margin-top: 30px;
            border: 1px solid #00ff41;
            padding: 18px;
            text-shadow: 0 0 8px #00ff41;
            box-shadow: 0 0 12px rgba(0, 255, 65, 0.2);
            display: none;
        }

        .connection-title {
            font-size: 18px;
            margin-bottom: 18px;
            letter-spacing: 2px;
        }

        .progress-container {
            width: 100%;
            height: 18px;
            border: 1px solid #00ff41;
            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background-color: #00ff41;
            box-shadow: 0 0 12px #00ff41;
        }

        .connection-percent {
            margin-top: 10px;
            text-align: right;
            font-size: 18px;
        }

        .connection-info {
            margin-top: 18px;
            font-size: 15px;
        }

        .connection-info p {
            margin: 7px 0;
        }

        /* USER PANEL */

        .user-panel {
            margin-top: 30px;
            border: 1px solid #00ff41;
            padding: 20px;
            text-align: center;
            text-shadow: 0 0 8px #00ff41;
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.25);
            display: none;
        }

        .user-title {
            font-size: 16px;
            letter-spacing: 2px;
            margin-bottom: 25px;
        }

        .user-name {
            font-size: 30px;
            font-weight: bold;
            letter-spacing: 4px;
            line-height: 1.3;
        }

        .user-name span {
            display: block;
        }

        .user-details {
            margin-top: 25px;
            text-align: left;
            font-size: 15px;
        }

        .user-details p {
            margin: 9px 0;
        }

        .user-details span {
            color: #00ff41;
        }

        .special-user {
            margin-top: 25px;
            padding: 10px;
            border: 1px solid #00ff41;
            font-size: 14px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {

            0%, 100% {
                opacity: 1;
                text-shadow: 0 0 8px #00ff41;
            }

            50% {
                opacity: 0.45;
                text-shadow: 0 0 20px #00ff41;
            }

        }

        /* MOBILE */

        @media (max-width: 600px) {

            body {
                padding: 18px;
            }

            .header {
                font-size: 15px;
                padding: 12px;
            }

            .terminal {
                font-size: 20px;
                line-height: 1.8;
            }

            .connection-panel {
                padding: 15px;
                margin-top: 25px;
            }

            .connection-title {
                font-size: 17px;
            }

            .connection-percent {
                font-size: 18px;
            }

            .connection-info {
                font-size: 15px;
            }

            .user-panel {
                padding: 18px;
            }

            .user-title {
                font-size: 14px;
            }

            .user-name {
                font-size: 28px;
            }

            .user-details {
                font-size: 15px;
            }

            .special-user {
                font-size: 13px;
            }

        }

    </style>

</head>

<body>

    <div class="header">
        <span>[ GULSHAN.EXE ]</span>
        <span>ANUJ SYSTEMS</span>
    </div>

    <div class="terminal" id="terminal"></div>

    <div class="connection-panel" id="connectionPanel">

        <div class="connection-title">
            SECURE CONNECTION
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="connection-percent" id="connectionPercent">
            0%
        </div>

        <div class="connection-info">
            <p>ENCRYPTION: AES-256</p>
            <p>PROTOCOL: SECURE</p>
            <p>STATUS: <span id="connectionStatus">CONNECTING...</span></p>
        </div>

    </div>

    <div class="user-panel" id="userPanel">

        <div class="user-title">
            USER IDENTIFIED ✓
        </div>

        <div class="user-name">
            GULSHAN
            <span>BHARDWAJ</span>
        </div>

        <div class="user-details">
            <p>STATUS: <span>ONLINE</span></p>
            <p>MATCH: <span>100%</span></p>
            <p>IDENTITY: <span>VERIFIED ✓</span></p>
        </div>

        <div class="special-user">
            ⚠ SPECIAL USER DETECTED
        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
